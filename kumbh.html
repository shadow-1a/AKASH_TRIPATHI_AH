<script>
(function () {
  var imgs = [].slice.call(document.querySelectorAll('img[data-q],img[data-t]'));
  var ok = 0, fail = 0, active = 0, queue = [], memo = {};

  var badge = document.createElement('div');
  badge.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:9999;background:rgba(0,0,0,.85);color:#fff;font:12px Arial;padding:6px 10px;border-radius:8px';
  document.body.appendChild(badge);
  function upd() {
    badge.textContent = 'Photos: ' + ok + ' loaded, ' + fail + ' failed, ' + (imgs.length - ok - fail) + ' loading';
    if (ok + fail === imgs.length) setTimeout(function () { badge.remove(); }, fail ? 40000 : 5000);
  }

  function card(t) {
    var s = '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><text x="450" y="320" font-size="54" font-family="Arial" fill="#fff" text-anchor="middle">' + t + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  }
  function canLoad(u) {
    return new Promise(function (res) {
      var i = new Image(), d = false;
      function end(v) { if (!d) { d = true; res(v); } }
      i.onload = function () { end(i.naturalWidth > 50); };
      i.onerror = function () { end(false); };
      setTimeout(function () { end(false); }, 10000);
      i.src = u;
    });
  }
  function getJSON(u) {
    var c = new AbortController();
    setTimeout(function () { c.abort(); }, 10000);
    return fetch(u, { signal: c.signal }).then(function (r) { return r.json(); });
  }
  function sorted(o) { return Object.values(o || {}).sort(function (a, b) { return a.index - b.index; }); }

  async function urlsFor(q) {
    var out = [];
    try {
      var a = await getJSON('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=4&gsrsearch=' + encodeURIComponent(q) + '&prop=pageimages&piprop=thumbnail&pithumbsize=800&format=json&origin=*');
      sorted((a.query || {}).pages).forEach(function (p) { if (p.thumbnail) out.push(p.thumbnail.source); });
    } catch (e) {}
    try {
      var b = await getJSON('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=' + encodeURIComponent(q) + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=800&format=json&origin=*');
      sorted((b.query || {}).pages).forEach(function (p) {
        var ii = p.imageinfo && p.imageinfo[0];
        if (ii && ii.mime === 'image/jpeg' && ii.thumburl) out.push(ii.thumburl);
      });
    } catch (e) {}
    return out.slice(0, 6);
  }
  async function resolve(queries) {
    for (var i = 0; i < queries.length; i++) {
      var urls = await urlsFor(queries[i]);
      for (var j = 0; j < urls.length; j++) { if (await canLoad(urls[j])) return urls[j]; }
    }
    return null;
  }
  function pump() {
    while (active < 3 && queue.length) { active++; queue.shift()(); }
  }
  function find(key, queries) {
    if (memo[key]) return memo[key];
    memo[key] = new Promise(function (res) {
      queue.push(function () {
        resolve(queries).then(res, function () { res(null); }).then(function () { active--; pump(); });
      });
      pump();
    });
    return memo[key];
  }

  imgs.forEach(function (img) {
    img.src = card(img.alt);                                   // orange name card first
    var raw = img.dataset.q || img.dataset.t || '';
    var queries = raw.split('|').map(function (s) { return s.replace(/_/g, ' ').trim(); }).filter(Boolean);
    find(raw, queries).then(function (u) {
      if (u) { img.src = u; ok++; } else { fail++; console.warn('No photo for:', raw); }
      upd();
    });
  });
  upd();
  window.addEventListener('error', function (e) { badge.textContent = 'Script error: ' + e.message; });
})();
</scr
