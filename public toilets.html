<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Stands | Prayagraj Tourism</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{font-family:Poppins,sans-serif}h1,h2,h3,.logo{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-[#1c0f0a] text-orange-50">
<header class="bg-orange-600 text-white sticky top-0 z-[1100] shadow">
  <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="logo text-2xl font-bold">Prayagraj Tourism</a>
    <div class="flex flex-wrap gap-4 text-sm font-medium">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="attractions.html">Attractions</a>
      <a href="kumbh.html">Kumbh Mela</a><a href="food.html">Food</a><a href="stay.html">Stay</a><a href="plan-trip.html">Plan Trip</a><a href="bus-stands.html" class="underline">Bus Stands</a>
    </div>
  </nav>
</header>

<main class="max-w-6xl mx-auto px-4 py-12">
  <h1 class="text-5xl font-extrabold text-orange-500">Bus Stands of Prayagraj</h1>
  <p class="text-orange-200/80 mt-3">All major UPSRTC &amp; private bus stands - routes, timings, facilities</p>

  <input id="search" type="text" onkeyup="applyFilters()" placeholder="Search by name, area or route (e.g. Lucknow, Naini, Varanasi)"
    class="w-full mt-6 px-4 py-3 rounded-full bg-[#120a07] border-2 border-orange-500 text-orange-50 placeholder-orange-200/50 focus:outline-none focus:border-orange-400">

  <div id="filters" class="flex flex-wrap gap-2 mt-4 text-sm">
    <button data-type="All" class="fbtn bg-orange-600 text-white px-4 py-2 rounded-full">All</button>
    <button data-type="UPSRTC" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">UPSRTC</button>
    <button data-type="Private" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Private</button>
    <button data-type="City Bus" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">City Bus</button>
  </div>

  <div id="stands" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></div>
  <p id="empty" class="hidden text-orange-200/80 mt-6">No bus stands match your search.</p>

  <h2 class="text-3xl font-bold text-orange-500 mt-14 mb-4">Bus Stands Map</h2>
  <div id="map" class="h-[450px] rounded-2xl shadow-lg z-0"></div>
</main>

<footer class="bg-black text-orange-200 text-center py-6 text-sm">© 2026 Prayagraj Tourism. Map data © OpenStreetMap contributors.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------- photo loader ---------- */
const cache = {};
function svgPlaceholder(t){
  t = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><text x="450" y="320" font-size="54" font-family="Arial" fill="#fff" text-anchor="middle">${t}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}
async function findPhoto(q){
  if (q in cache) return cache[q];
  let url = null;
  try { // 1) Wikimedia Commons photo search
    const a = await (await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=' + encodeURIComponent(q) + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*')).json();
    const pages = Object.values((a.query || {}).pages || {}).sort((x, y) => x.index - y.index);
    const hit = pages.find(p => p.imageinfo && p.imageinfo[0].mime === 'image/jpeg');
    if (hit) url = hit.imageinfo[0].thumburl;
  } catch (e) {}
  if (!url) try { // 2) Wikipedia article image
    const b = await (await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=3&gsrsearch=' + encodeURIComponent(q) + '&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*')).json();
    const pg = Object.values((b.query || {}).pages || {}).sort((x, y) => x.index - y.index).find(p => p.thumbnail);
    if (pg) url = pg.thumbnail.source;
  } catch (e) {}
  return (cache[q] = url);
}
function fillPhotos(){
  document.querySelectorAll('img[data-q]:not([data-done])').forEach(img => {
    img.dataset.done = 1;
    img.src = svgPlaceholder(img.alt);
    findPhoto(img.dataset.q).then(u => { if (u) img.src = u; });
  });
}

/* ---------- bus stands ---------- */
const stands = [
 {n:"Civil Lines Bus Stand (Leader Road)", c:[25.4450,81.8350], area:"Civil Lines", type:"UPSRTC", routes:"Lucknow, Kanpur, Varanasi, Delhi, Agra", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Civil Lines bus stand Allahabad"},
 {n:"Zero Road Bus Stand", c:[25.4400,81.8300], area:"Zero Road", type:"UPSRTC", routes:"Varanasi, Jaunpur, Mirzapur, Bhadohi", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Zero Road bus stand Allahabad"},
 {n:"Jhunsi Bus Stand", c:[25.4350,81.9050], area:"Jhunsi", type:"UPSRTC", routes:"Varanasi, Gorakhpur, Azamgarh", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Jhunsi bus stand Prayagraj"},
 {n:"Naini Bus Stand", c:[25.4200,81.8600], area:"Naini", type:"UPSRTC", routes:"Rewa, Satna, Mirzapur, Chitrakoot", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Naini bus stand Allahabad"},
 {n:"Phaphamau Bus Stand", c:[25.4700,81.8700], area:"Phaphamau", type:"UPSRTC", routes:"Pratapgarh, Sultanpur, Ayodhya", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Phaphamau bus stand Prayagraj"},
 {n:"Andawa / Jhusi Crossing Stand", c:[25.4300,81.9000], area:"Andawa", type:"Private", routes:"Varanasi, Patna, Kolkata", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Bus stand Prayagraj"},
 {n:"Prayagraj Junction City Bus Stand", c:[25.4455,81.8325], area:"Railway Station Road", type:"City Bus", routes:"City - Sangam, Civil Lines, Naini, Jhunsi", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Prayagraj Junction bus"},
 {n:"Mundera Mandi Private Stand", c:[25.4500,81.8700], area:"Mundera", type:"Private", routes:"Delhi, Lucknow, Kanpur AC Sleeper", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Private bus stand Allahabad"},
 {n:"Sangam Temporary Bus Stand (Mela Area)", c:[25.4300,81.8850], area:"Sangam", type:"UPSRTC", routes:"Special Mela - All UP Cities", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Kumbh Mela bus stand Prayagraj"},
 {n:"Allahapur Bus Stop", c:[25.4600,81.8550], area:"Allahapur", type:"City Bus", routes:"Civil Lines, Katra, University", fac:"Waiting Hall, Toilet, Enquiry, Food Stall", q:"Allahapur Allahabad"}
];

const badge = {"UPSRTC":"bg-orange-600", "Private":"bg-green-600", "City Bus":"bg-blue-600"};

const map = L.map('map').setView([25.4450,81.8400], 12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers = [];
stands.forEach((p, i) => {
  markers[i] = L.marker(p.c).addTo(map).bindPopup(`<b>${p.n}</b><br>${p.routes}<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.c[0]},${p.c[1]}">Get directions</a>`);
  document.getElementById('stands').insertAdjacentHTML('beforeend', `
    <div class="stand group bg-[#120a07] rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition" data-i="${i}">
      <div class="h-48 overflow-hidden">
        <img data-q="${p.q}" alt="${p.n}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
      </div>
      <div class="p-5">
        <h3 class="text-xl font-bold">${p.n}</h3>
        <span class="${badge[p.type]} text-white text-xs px-3 py-1 rounded-full inline-block mt-2">${p.type}</span>
        <p class="text-sm text-orange-300 mt-2">${p.area}</p>
        <p class="text-sm text-orange-100/80 mt-1"><span class="font-semibold">Routes:</span> ${p.routes}</p>
        <p class="text-xs text-orange-100/70 mt-2"><span class="font-semibold">Facilities:</span> ${p.fac}</p>
        <div class="flex gap-2 mt-4 text-sm">
          <button onclick="showOnMap(${i})" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-full">View on map</button>
          <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.c[0]},${p.c[1]}" class="border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Directions</a>
        </div>
      </div>
    </div>`);
});
fillPhotos();

/* ---------- search + filter ---------- */
let activeType = 'All';
function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.stand').forEach(card => {
    const p = stands[card.dataset.i];
    const text = (p.n + ' ' + p.area + ' ' + p.routes + ' ' + p.type).toLowerCase();
    const ok = (activeType === 'All' || p.type === activeType) && (!q || text.includes(q));
    card.classList.toggle('hidden', !ok);
    if (ok) shown++;
  });
  document.getElementById('empty').classList.toggle('hidden', shown > 0);
}
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeType = btn.dataset.type;
    document.querySelectorAll('.fbtn').forEach(b => {
      const on = b === btn;
      b.className = 'fbtn px-4 py-2 rounded-full ' + (on ? 'bg-orange-600 text-white' : 'border border-orange-500 text-orange-400 hover:bg-orange-950');
    });
    applyFilters();
  });
});

function showOnMap(i){ map.setView(stands[i].c, 15); markers[i].openPopup(); document.getElementById('map').scrollIntoView({behavior:'smooth', block:'center'}); }
</script>
</body>
</html>
