<section id="nearby" class="nb-wrap">
  <h2>Hotels Near You</h2>
  <div class="nb-bar">
    <button id="nbFind" class="nb-btn">📍 Find hotels near me</button>
    <input id="nbQ" type="search" placeholder="Search by name">
    <select id="nbType">
      <option value="">All types</option>
      <option>Hotel</option><option>Guest House</option>
      <option>Hostel</option><option>Apartment</option>
    </select>
  </div>
  <p id="nbStatus" class="nb-status">Tap the button to see hotels around you.</p>
  <div id="nbGrid" class="nb-grid"></div>
  <p class="nb-attr">Data © OpenStreetMap contributors. Prices are not stored in OpenStreetMap, so use Check price for live rates.</p>
</section>

<style>
:root{--nb-o:#ff6b1a;--nb-card:#160a08;--nb-text:#f3e9e4}
.nb-wrap{max-width:1100px;margin:40px auto;padding:0 20px;font-family:inherit;color:var(--nb-text)}
.nb-wrap h2{color:var(--nb-o)}
.nb-bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.nb-bar input,.nb-bar select{flex:1 1 160px;padding:10px 14px;border-radius:999px;border:1px solid #4a2418;background:var(--nb-card);color:var(--nb-text);font:inherit}
.nb-btn{background:var(--nb-o);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:inherit;cursor:pointer}
.nb-status{margin:8px 0}
.nb-grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:900px){.nb-grid{grid-template-columns:repeat(3,1fr)}}
.nb-card{background:var(--nb-card);border-radius:18px;padding:18px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.nb-card h3{margin:0 0 6px;color:#fff}
.nb-card p{margin:4px 0;font-size:.9rem}
.nb-tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:999px;background:#3a1a10;color:var(--nb-o);margin-bottom:6px}
.nb-price{color:var(--nb-o);font-weight:600}
.nb-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nb-links a{padding:8px 14px;border-radius:999px;background:var(--nb-o);color:#fff;text-decoration:none;font-size:.85rem}
.nb-links a.alt{background:transparent;border:1px solid var(--nb-o);color:var(--nb-o)}
.nb-attr{font-size:.78rem;opacity:.6;margin-top:18px}
</style>

<script>
(function(){
  var RADIUS = 5000; // metres around YOU. Change here.
  var DEFAULT = [25.4358, 81.8463]; // city centre if location is blocked
  var ENDPOINTS = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  var TYPES = {hotel:'Hotel',guest_house:'Guest House',hostel:'Hostel',apartment:'Apartment',motel:'Motel'};
  var $ = function(id){return document.getElementById(id)};
  var all = [];

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function km(a,b,c,d){var r=Math.PI/180,R=6371,x=(c-a)*r,y=(d-b)*r;
    var h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);
    return 2*R*Math.asin(Math.sqrt(h))}

  function query(lat,lon){
    var f=['hotel','guest_house','hostel','apartment','motel'].map(function(t){
      return 'nwr(around:'+RADIUS+','+lat+','+lon+')["tourism"="'+t+'"];'}).join('\n');
    return '[out:json][timeout:30];\n(\n'+f+'\n);\nout center;';
  }

  async function overpass(q){
    var err;
    for (var i=0;i<ENDPOINTS.length;i++){
      try{
        var r = await fetch(ENDPOINTS[i],{method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body:'data='+encodeURIComponent(q)});
        if(!r.ok) throw new Error('HTTP '+r.status);
        return await r.json();
      }catch(e){err=e}
    }
    throw err;
  }

  function getPos(){
    return new Promise(function(res){
      if(!navigator.geolocation) return res({lat:DEFAULT[0],lon:DEFAULT[1],real:false});
      navigator.geolocation.getCurrentPosition(
        function(p){res({lat:p.coords.latitude,lon:p.coords.longitude,real:true})},
        function(){res({lat:DEFAULT[0],lon:DEFAULT[1],real:false})},
        {enableHighAccuracy:true,timeout:10000});
    });
  }

  async function load(){
    $('nbStatus').innerHTML='Finding your location...';
    var pos = await getPos();
    $('nbStatus').textContent='Loading hotels...';
    var key='nb_stay_'+pos.lat.toFixed(2)+'_'+pos.lon.toFixed(2);
    var data=null;
    try{var c=JSON.parse(localStorage.getItem(key)||'null');
      if(c && Date.now()-c.t<3600000) data=c.d;}catch(e){}
    try{
      if(!data){
        var j = await overpass(query(pos.lat,pos.lon));
        data = j.elements.map(function(el){
          var t=el.tags||{};
          var la=el.lat!=null?el.lat:(el.center&&el.center.lat);
          var lo=el.lon!=null?el.lon:(el.center&&el.center.lon);
          if(!t.name||la==null||lo==null) return null;
          return {id:el.type+el.id,name:t.name,lat:la,lon:lo,
            type:TYPES[t.tourism]||'Other',
            addr:t['addr:full']||[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),
            phone:t.phone||t['contact:phone']||'',
            stars:t.stars||'',
            price:t.charge||t['fee']||''};
        }).filter(Boolean);
        try{localStorage.setItem(key,JSON.stringify({t:Date.now(),d:data}))}catch(e){}
      }
      data.forEach(function(h){h.dist=km(pos.lat,pos.lon,h.lat,h.lon)});
      all=data;
      console.log('Stay count:',all.length);
      render(pos.real);
    }catch(e){
      console.error(e);
      $('nbStatus').innerHTML='Could not load. Tap to retry <button class="nb-btn" id="nbRetry">Retry</button>';
      $('nbRetry').onclick=load;
    }
  }

  function render(real){
    var q=$('nbQ').value.trim().toLowerCase(), ty=$('nbType').value;
    var items=all.filter(function(h){return (!q||h.name.toLowerCase().indexOf(q)>-1)&&(!ty||h.type===ty)})
                 .sort(function(a,b){return a.dist-b.dist});
    $('nbStatus').textContent = items.length
      ? 'Found '+items.length+' hotels'+(real?' near you':' near Prayagraj city centre (location not shared)')
      : 'No places found';
    $('nbGrid').innerHTML = items.map(function(h){
      var n=encodeURIComponent(h.name+' Prayagraj');
      return '<div class="nb-card"><h3>'+esc(h.name)+'</h3>'
        +'<span class="nb-tag">'+esc(h.type)+(h.stars?' · '+esc(h.stars)+'★':'')+'</span>'
        +'<p>📏 '+h.dist.toFixed(1)+' km from '+(real?'you':'city centre')+'</p>'
        +(h.addr?'<p>📍 '+esc(h.addr)+'</p>':'')
        +(h.phone?'<p>📞 '+esc(h.phone)+'</p>':'')
        +'<p>💰 '+(h.price?'<span class="nb-price">'+esc(h.price)+'</span>':'Price: tap Check price for live rates')+'</p>'
        +'<div class="nb-links">'
        +'<a href="https://www.google.com/maps/dir/?api=1&destination='+h.lat+','+h.lon+'" target="_blank" rel="noopener">Directions</a>'
        +'<a class="alt" href="https://www.google.com/search?q='+n+'+hotel+price" target="_blank" rel="noopener">Check price</a>'
        +'<a class="alt" href="https://www.booking.com/searchresults.html?ss='+n+'" target="_blank" rel="noopener">Booking.com</a>'
        +'</div></div>';
    }).join('');
  }

  $('nbFind').onclick=load;
  $('nbQ').addEventListener('input',function(){render(true)});
  $('nbType').addEventListener('change',function(){render(true)});
})();
</script>
