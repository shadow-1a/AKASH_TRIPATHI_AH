<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay | Prayagraj Tourism</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{font-family:Poppins,sans-serif}h1,h2,h3,.logo{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-[#1c0f0a] text-orange-50">
<header class="bg-orange-600 text-white sticky top-0 z-[1100] shadow">
  <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="logo text-2xl font-bold">Prayagraj Tourism</a>
    <div class="flex flex-wrap gap-4 text-sm font-medium">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="attractions.html">Attractions</a>
      <a href="kumbh.html">Kumbh Mela</a><a href="food.html">Food</a><a href="stay.html" class="underline">Stay</a><a href="plan-trip.html">Plan Trip</a>
    </div>
  </nav>
</header>
<main class="max-w-6xl mx-auto px-4 py-12">
  <h1 class="text-5xl font-extrabold text-orange-500">Where to Stay</h1>
  <div id="cards" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-8"></div>
  <h2 class="text-3xl font-bold text-orange-500 mt-14 mb-4">Stay Areas Map</h2>
  <div id="map" class="h-[420px] rounded-2xl shadow-lg z-0"></div>
</main>
<footer class="bg-black text-orange-200 text-center py-6 text-sm">© 2026 Prayagraj Tourism. Map data © OpenStreetMap contributors. Photos via Wikimedia Commons / Wikipedia.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const cache={};
function svgPlaceholder(t){const s=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><text x="450" y="320" font-size="54" font-family="Arial" fill="#fff" text-anchor="middle">${t}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);}
async function findPhoto(q){
  if(q in cache)return cache[q];let url=null;
  try{const a=await(await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch='+encodeURIComponent(q)+'&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*')).json();
   const pg=Object.values((a.query||{}).pages||{}).sort((x,y)=>x.index-y.index).find(p=>p.imageinfo&&p.imageinfo[0].mime==='image/jpeg');if(pg)url=pg.imageinfo[0].thumburl;}catch(e){}
  if(!url)try{const b=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=3&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*')).json();
   const pg=Object.values((b.query||{}).pages||{}).sort((x,y)=>x.index-y.index).find(p=>p.thumbnail);if(pg)url=pg.thumbnail.source;}catch(e){}
  return(cache[q]=url);
}
function fillPhotos(){document.querySelectorAll('img[data-q]:not([data-done])').forEach(img=>{img.dataset.done=1;img.src=svgPlaceholder(img.alt);findPhoto(img.dataset.q).then(u=>{if(u)img.src=u;});});}

const areas=[
 {n:'Civil Lines',q:'Civil Lines Allahabad',c:[25.4533,81.8392],d:'Modern hotels, restaurants and shopping. A good all-round base.'},
 {n:'Near Railway Station',q:'Allahabad Junction railway station',c:[25.4475,81.8271],d:'Budget hotels and lodges, easy for arrivals and departures.'},
 {n:'Sangam Side',q:'Sangam Allahabad ghat',c:[25.4250,81.8880],d:'Guest houses close to the holy bathing area.'},
 {n:'Kumbh Tent City',q:'Kumbh Mela tents Allahabad',c:[25.4220,81.8850],d:'Temporary tents during the Mela. Book early.'}
];
const map=L.map('map').setView([25.4400,81.8500],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=[];
areas.forEach((p,i)=>{
 markers[i]=L.marker(p.c).addTo(map).bindPopup(`<b>${p.n}</b><br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.c[0]},${p.c[1]}">Get directions</a>`);
 document.getElementById('cards').insertAdjacentHTML('beforeend',`
  <div class="group bg-[#120a07] rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition">
   <div class="h-44 overflow-hidden"><img data-q="${p.q}" alt="${p.n}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700"></div>
   <div class="p-4"><h3 class="text-xl font-bold">${p.n}</h3><p class="text-sm text-orange-100/80 mt-1">${p.d}</p>
    <button onclick="showOnMap(${i})" class="mt-3 bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-full text-sm">View on map</button></div></div>`);
});
fillPhotos();
function showOnMap(i){map.setView(areas[i].c,15);markers[i].openPopup();document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'});}
</script>
</body>
</html>
