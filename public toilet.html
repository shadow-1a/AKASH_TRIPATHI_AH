<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Toilets | Prayagraj Tourism</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body class="bg-[#1c0f0a] text-orange-50">
<header class="bg-orange-600 text-white sticky top-0 z-[1100] shadow">
  <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="logo text-2xl font-bold">Prayagraj Tourism</a>
    <div class="flex flex-wrap gap-4 text-sm font-medium">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="attractions.html">Attractions</a>
      <a href="kumbh.html">Kumbh Mela</a><a href="food.html">Food</a><a href="stay.html">Stay</a><a href="plan-trip.html">Plan Trip</a><a href="public-toilets.html" class="underline">Toilets</a>
    </div>
  </nav>
</header>

<main class="max-w-6xl mx-auto px-4 py-12">
  <h1 class="text-5xl font-extrabold text-orange-500">Public Toilets in Prayagraj</h1>
  <p class="text-orange-200/80 mt-3">Find nearest clean toilet from your current location</p>

  <div class="mt-6 flex flex-col gap-4">
    <div class="flex flex-wrap items-center gap-3">
      <button id="locateBtn" class="bg-orange-600 hover:bg-orange-500 text-white font-semibold px-6 py-3 rounded-full text-base">📍 Use My Current Location</button>
      <span id="locationStatus" class="text-sm text-orange-200">Click to find nearest toilets</span>
    </div>
    <div class="flex flex-wrap items-center gap-4 text-sm">
      <label class="flex items-center gap-2">
        <span class="text-orange-300">Sort:</span>
        <select id="sort" class="bg-[#120a07] border border-orange-500 text-orange-50 rounded-full px-4 py-2 focus:outline-none">
          <option value="nearest">Nearest First</option>
          <option value="clean">Cleanest First</option>
          <option value="free">Free First</option>
        </select>
      </label>
      <div id="filters" class="flex flex-wrap gap-2">
        <button data-f="All" class="fbtn bg-orange-600 text-white px-4 py-2 rounded-full">All</button>
        <button data-f="Free" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Free</button>
        <button data-f="Paid" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Paid</button>
        <button data-f="Sulabh" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Sulabh</button>
        <button data-f="Women Only" class="fbtn border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Women Only</button>
      </div>
    </div>
  </div>

  <div id="toilets" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></div>
  <p id="empty" class="hidden text-orange-200/80 mt-6">No toilets match this filter.</p>

  <h2 class="text-3xl font-bold text-orange-500 mt-14 mb-4">Toilets Map</h2>
  <div id="map" class="h-[450px] rounded-2xl shadow-lg z-0"></div>
</main>

<footer class="bg-black text-orange-200 text-center py-6 text-sm">© 2026 Prayagraj Tourism. Map data © OpenStreetMap contributors.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------- photo loader ---------- */
const cache = {};
function svgPlaceholder(t){
  t = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const s = `<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea580c"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><text x="450" y="320" font-size="54" font-family="Arial" fill="#fff" text-anchor="middle">${t}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}
async function findPhoto(q){
  if (q in cache) return cache[q];
  let url = null;
  try { // 1) Wikimedia Commons photo search
    const a = await (await fetch('https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=10&gsrsearch=' + encodeURIComponent(q) + '&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*')).json();
    const pages = Object.values((a.query || {}).pages || {}).sort((x, y) => x.index - y.index);
    const hit = pages.find(p => p.imageinfo && p.imageinfo[0].mime === 'image/jpeg');
    if (hit) url = hit.imageinfo[0].thumburl;
  } catch (e) {}
  if (!url) try { // 2) Wikipedia article image
    const b = await (await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=3&gsrsearch=' + encodeURIComponent(q) + '&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*')).json();
    const pg = Object.values((b.query || {}).pages || {}).sort((x, y) => x.index - y.index).find(p => p.thumbnail);
    if (pg) url = pg.thumbnail.source;
  } catch (e) {}
  return (cache[q] = url);
}
function fillPhotos(){
  document.querySelectorAll('img[data-q]:not([data-done])').forEach(img => {
    img.dataset.done = 1;
    img.src = svgPlaceholder(img.alt);
    findPhoto(img.dataset.q).then(u => { if (u) img.src = u; });
  });
}

/* ---------- toilets ----------
   price: 0 = free. rating/reviews are null until you have real review data;
   set e.g. rating:4.2, reviews:120 to show stars and enable "Cleanest First". */
const toilets = [
 {n:"Sulabh Toilet - Triveni Sangam", c:[25.4300,81.8870], area:"Sangam", addr:"Triveni Sangam", label:"Sulabh • Paid ₹5", price:5, sulabh:true, women:false, fac:"Clean, Western + Indian, Open 24 hrs", rating:null, reviews:null, q:"Sulabh toilet Sangam Allahabad"},
 {n:"Public Toilet - Civil Lines, MG Marg", c:[25.4535,81.8395], area:"Civil Lines", addr:"MG Marg", label:"Paid ₹5", price:5, sulabh:false, women:false, fac:"Clean, Water, 6AM-10PM", rating:null, reviews:null, q:"Public toilet Civil Lines Allahabad"},
 {n:"Sulabh Toilet - Prayagraj Junction Platform 1", c:[25.4455,81.8325], area:"Railway Station", addr:"Prayagraj Junction, Platform 1", label:"Sulabh • Paid ₹10", price:10, sulabh:true, women:false, fac:"Bath + Toilet, Open 24 hrs", rating:null, reviews:null, q:"Prayagraj Junction toilet"},
 {n:"Public Toilet - Chowk, Ghantaghar", c:[25.4410,81.8270], area:"Chowk", addr:"Ghantaghar", label:"Free", price:0, sulabh:false, women:false, fac:"Basic, 6AM-9PM", rating:null, reviews:null, q:"Public toilet Chowk Allahabad"},
 {n:"Sulabh Toilet - Anand Bhawan Road", c:[25.4527,81.8497], area:"Anand Bhawan", addr:"Anand Bhawan Road", label:"Sulabh • Paid ₹5", price:5, sulabh:true, women:false, fac:"Clean, Women Separate", rating:null, reviews:null, q:"Sulabh toilet Allahabad"},
 {n:"Public Toilet - Khusro Bagh Gate", c:[25.4440,81.8300], area:"Khusro Bagh", addr:"Khusro Bagh Gate", label:"Free", price:0, sulabh:false, women:false, fac:"Basic, Day time", rating:null, reviews:null, q:"Khusro Bagh Allahabad"},
 {n:"Sulabh Toilet - Katra Market", c:[25.4560,81.8450], area:"Katra", addr:"Katra Market", label:"Sulabh • Paid ₹5", price:5, sulabh:true, women:false, fac:"Clean, Water", rating:null, reviews:null, q:"Public toilet Katra Allahabad"},
 {n:"Public Toilet - Allahabad Fort Road", c:[25.4284,81.8750], area:"Fort Road", addr:"Allahabad Fort Road", label:"Paid ₹5", price:5, sulabh:false, women:false, fac:"Tourist area, Clean", rating:null, reviews:null, q:"Allahabad Fort toilet"},
 {n:"Women Only Toilet - Company Bagh", c:[25.4580,81.8500], area:"Azad Park", addr:"Company Bagh", label:"Women Only • Free", price:0, sulabh:false, women:true, fac:"Women only, Clean, 7AM-8PM", rating:null, reviews:null, q:"Azad Park Allahabad"},
 {n:"Sulabh Toilet - Naini Bus Stand", c:[25.4200,81.8600], area:"Naini", addr:"Naini Bus Stand", label:"Sulabh • Paid ₹5", price:5, sulabh:true, women:false, fac:"Open 24 hrs, Bath available", rating:null, reviews:null, q:"Naini bus stand toilet"},
 {n:"Public Toilet - Jhunsi Ghat", c:[25.4350,81.9050], area:"Jhunsi", addr:"Jhunsi Ghat", label:"Free", price:0, sulabh:false, women:false, fac:"Basic, Near Ghat", rating:null, reviews:null, q:"Jhunsi Ghat Prayagraj"},
 {n:"Sulabh Toilet - Zero Road", c:[25.4400,81.8300], area:"Zero Road", addr:"Zero Road", label:"Sulabh • Paid ₹5", price:5, sulabh:true, women:false, fac:"Clean, Open 24 hrs", rating:null, reviews:null, q:"Zero Road Allahabad"}
];

/* ---------- state ---------- */
let userLat = null, userLng = null;
let userMarker = null, routeLine = null;
let activeFilter = 'All';

/* ---------- distance helpers ---------- */
function getDistance(lat1, lon1, lat2, lon2){            // Haversine, km
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(lat2 - lat1), dLon = r(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function walkMinutes(km){ return Math.max(1, Math.round(km / 5 * 60)); }   // 5 km/h
function fmtDist(km){ return km < 1 ? Math.round(km * 1000) + ' m' : km.toFixed(1) + ' km'; }
function fmtWalk(min){ return min < 60 ? min + ' min walk' : Math.floor(min/60) + ' h ' + (min % 60) + ' min walk'; }
toilets.forEach(t => t.km = null);
function updateDistances(){
  toilets.forEach(t => { t.km = userLat === null ? null : getDistance(userLat, userLng, t.c[0], t.c[1]); });
}
function distText(t){ return t.km === null ? 'Enable location to see distance' : fmtDist(t.km) + ' away • ' + fmtWalk(walkMinutes(t.km)); }
function distColor(t){
  if (t.km === null) return 'bg-stone-700';
  return t.km < 1 ? 'bg-green-600' : (t.km <= 3 ? 'bg-orange-600' : 'bg-red-600');
}
function stars(t){
  if (t.rating === null) return '<span class="text-orange-100/50">☆☆☆☆☆</span> <span class="text-orange-100/60">No reviews yet</span>';
  const full = Math.round(t.rating);
  return '<span class="text-yellow-400">' + '★'.repeat(full) + '</span><span class="text-orange-100/30">' + '★'.repeat(5 - full) + '</span> ' + t.rating.toFixed(1) + ' (' + t.reviews + ' reviews)';
}

/* ---------- map ---------- */
const map = L.map('map').setView([25.4450,81.8400], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers = [];
function popupHtml(i){
  const t = toilets[i];
  return `<b>${t.n}</b><br>${t.label}<br>${t.km === null ? 'Enable location to see distance' : distText(t)}<br><a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${t.c[0]},${t.c[1]}">Get directions</a>`;
}
toilets.forEach((t, i) => { markers[i] = L.marker(t.c).addTo(map).bindPopup(() => popupHtml(i)); });

/* ---------- render ---------- */
function matchesFilter(t){
  switch (activeFilter){
    case 'Free': return t.price === 0;
    case 'Paid': return t.price > 0;
    case 'Sulabh': return t.sulabh;
    case 'Women Only': return t.women;
    default: return true;
  }
}
function sortedIndexes(){
  const mode = document.getElementById('sort').value;
  const idx = toilets.map((_, i) => i).filter(i => matchesFilter(toilets[i]));
  const byArea = (a, b) => toilets[a].area.localeCompare(toilets[b].area) || toilets[a].n.localeCompare(toilets[b].n);
  const byDist = (a, b) => toilets[a].km - toilets[b].km;
  const located = userLat !== null;
  if (mode === 'clean'){
    idx.sort((a, b) => (toilets[b].rating ?? -1) - (toilets[a].rating ?? -1) || (located ? byDist(a, b) : byArea(a, b)));
  } else if (mode === 'free'){
    idx.sort((a, b) => toilets[a].price - toilets[b].price || (located ? byDist(a, b) : byArea(a, b)));
  } else {
    idx.sort(located ? byDist : byArea);
  }
  return idx;
}
function render(){
  const box = document.getElementById('toilets');
  box.innerHTML = '';
  const idx = sortedIndexes();
  document.getElementById('empty').classList.toggle('hidden', idx.length > 0);
  idx.forEach(i => {
    const t = toilets[i];
    box.insertAdjacentHTML('beforeend', `
    <div class="group bg-[#120a07] rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition">
      <div class="h-40 overflow-hidden">
        <img data-q="${t.q}" alt="${t.n}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
      </div>
      <div class="p-5">
        <h3 class="text-xl font-bold">${t.n}</h3>
        <div class="${distColor(t)} text-white text-sm font-semibold px-4 py-2 rounded-full inline-block mt-3">${distText(t)}</div>
        <div class="mt-2"><span class="bg-orange-950 border border-orange-500 text-orange-300 text-xs px-3 py-1 rounded-full inline-block">${t.label}</span></div>
        <p class="text-sm text-orange-300 mt-2">${t.area} — ${t.addr}</p>
        <p class="text-xs text-orange-100/70 mt-1"><span class="font-semibold">Facilities:</span> ${t.fac}</p>
        <p class="text-sm mt-2">${stars(t)}</p>
        <div class="flex gap-2 mt-4 text-sm">
          <button onclick="showOnMap(${i})" class="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-full">View on map</button>
          <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${t.c[0]},${t.c[1]}" class="border border-orange-500 text-orange-400 px-4 py-2 rounded-full hover:bg-orange-950">Directions</a>
        </div>
      </div>
    </div>`);
  });
  fillPhotos();
}

function showOnMap(i){
  const t = toilets[i];
  if (routeLine){ map.removeLayer(routeLine); routeLine = null; }
  if (userLat !== null){
    routeLine = L.polyline([[userLat, userLng], t.c], {color:'#2563eb', weight:3, dashArray:'6 8'}).addTo(map);
    map.fitBounds(L.latLngBounds([[userLat, userLng], t.c]), {padding:[60,60], maxZoom:15});
  } else {
    map.setView(t.c, 15);
  }
  markers[i].openPopup();
  document.getElementById('map').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- geolocation ---------- */
const statusEl = document.getElementById('locationStatus');
document.getElementById('locateBtn').addEventListener('click', () => {
  if (!navigator.geolocation){
    statusEl.textContent = 'Location is not supported by your browser. Showing all toilets sorted by area.';
    render();
    return;
  }
  statusEl.textContent = 'Getting your location...';
  navigator.geolocation.getCurrentPosition(pos => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    updateDistances();
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker([userLat, userLng], {radius:9, color:'#fff', weight:2, fillColor:'#2563eb', fillOpacity:1}).addTo(map).bindPopup('<b>You are here</b>');
    document.getElementById('sort').value = 'nearest';
    render();
    const nearest = sortedIndexes()[0];
    statusEl.textContent = nearest === undefined
      ? 'Location found.'
      : 'Location found. Nearest: ' + toilets[nearest].n + ' (' + fmtDist(toilets[nearest].km) + ').';
    map.fitBounds(L.latLngBounds([[userLat, userLng]].concat(toilets.map(t => t.c))), {padding:[40,40]});
  }, () => {
    userLat = userLng = null;
    updateDistances();
    statusEl.textContent = 'Location denied. Showing all toilets sorted by area. Enable location to see distance.';
    render();
  }, {enableHighAccuracy:true, timeout:10000});
});

/* ---------- sort + filter ---------- */
document.getElementById('sort').addEventListener('change', render);
document.querySelectorAll('.fbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.f;
    document.querySelectorAll('.fbtn').forEach(b => {
      b.className = 'fbtn px-4 py-2 rounded-full ' + (b === btn ? 'bg-orange-600 text-white' : 'border border-orange-500 text-orange-400 hover:bg-orange-950');
    });
    render();
  });
});

render();
</script>
</body>
</html>
