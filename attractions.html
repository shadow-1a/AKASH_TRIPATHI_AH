<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attractions | Prayagraj Tourism</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>body{font-family:Poppins,sans-serif}h1,h2,h3,.logo{font-family:'Playfair Display',serif}</style>
</head>
<body class="bg-orange-50 text-gray-800">
<header class="bg-orange-700 text-white sticky top-0 z-[1100]">
  <nav class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <a href="index.html" class="logo text-xl font-bold">Prayagraj Tourism</a>
    <div class="flex flex-wrap gap-4 text-sm">
      <a href="index.html">Home</a><a href="about.html">About</a><a href="attractions.html">Attractions</a>
      <a href="kumbh.html">Kumbh Mela</a><a href="food.html">Food</a><a href="stay.html">Stay</a><a href="plan-trip.html">Plan Trip</a>
    </div>
  </nav>
</header>
<main class="max-w-6xl mx-auto px-4 py-12">
  <h1 class="text-4xl font-bold text-orange-800">Top Attractions</h1>
  <div id="cards" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6"></div>
  <h2 class="text-3xl font-bold text-orange-800 mt-12 mb-4">Map</h2>
  <div id="map" class="h-[420px] rounded-xl shadow z-0"></div>
</main>
<footer class="bg-orange-900 text-orange-100 text-center py-6 text-sm">© 2026 Prayagraj Tourism. Map data © OpenStreetMap contributors.</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places=[
 {n:'Triveni Sangam',img:'sangam.jpg',c:[25.4300,81.8870],d:'Where the Ganga, Yamuna and Saraswati meet. Boat rides available.'},
 {n:'Allahabad Fort',img:'fort.jpg',c:[25.4284,81.8750],d:'Built by Akbar, with the Patalpuri temple and Akshayavat inside.'},
 {n:'Anand Bhawan',img:'anand-bhawan.jpg',c:[25.4527,81.8497],d:'Nehru family home, now a museum.'},
 {n:'Khusro Bagh',img:'khusro-bagh.jpg',c:[25.4440,81.8300],d:'Walled Mughal garden with beautiful tombs.'},
 {n:'Chandrashekhar Azad Park',img:'azad-park.jpg',c:[25.4580,81.8500],d:'Large park with a museum and memorial.'},
 {n:'Bade Hanuman Mandir',img:'hanuman.jpg',c:[25.4290,81.8800],d:'Rare reclining Hanuman idol near the Sangam.'}
];
const map=L.map('map').setView([25.4358,81.8463],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=[];
places.forEach((p,i)=>{
 markers[i]=L.marker(p.c).addTo(map).bindPopup(`<b>${p.n}</b>`);
 document.getElementById('cards').insertAdjacentHTML('beforeend',`
  <div class="bg-white rounded-xl shadow overflow-hidden">
   <img src="images/${p.img}" onerror="this.src='https://placehold.co/600x350?text=${encodeURIComponent(p.n)}'" alt="${p.n}" class="w-full h-48 object-cover">
   <div class="p-4"><h3 class="text-xl font-bold">${p.n}</h3><p class="text-sm mt-1">${p.d}</p>
    <div class="flex gap-2 mt-3 text-sm">
     <button onclick="show(${i})" class="bg-orange-600 text-white px-3 py-1 rounded-full">View on map</button>
     <a target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${p.c[0]},${p.c[1]}" class="border border-orange-600 text-orange-700 px-3 py-1 rounded-full">Directions</a>
    </div></div></div>`);
});
function show(i){map.setView(places[i].c,15);markers[i].openPopup();document.getElementById('map').scrollIntoView({behavior:'smooth'});}
</script>
</body>
</html>
